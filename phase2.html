 for(const q of F){const yy=q.y+Math.sin(time/500+q.ph)*2;drawChest(ctx,q.x-18,yy-8,q.rot+Math.sin(time/700+q.ph)*.1,.95);ctx.fillStyle='rgba(10,30,60,.5)';ctx.fillRect(q.x-20,yy+6,40,6)}
 for(const p of C)drawChest(ctx,p.x-18,p.y-11,p.rot,1);
 for(const e of E){if(e.bark&&e.barkL>0&&!e.fallen){ctx.font='18px VT323, monospace';const w=ctx.measureText(e.bark).width+12,bx=e.x+24-w/2,by=e.y+48-(e.o.scale||1)*(e.o.hat==='cook'?84:(e.disg?80:68));
  ctx.fillStyle='rgba(243,234,211,.95)';ctx.fillRect(bx,by-18,w,20);ctx.strokeStyle='#2a1c12';ctx.lineWidth=1.5;ctx.strokeRect(bx,by-18,w,20);ctx.fillStyle='#2a1c12';ctx.fillText(e.bark,bx+6,by-3)}}
 if(near){const ny=near.y+48-(near.o.scale||1)*(near.o.hat==='cook'?90:74)+Math.sin(time/200)*2;ctx.fillStyle='#111';ctx.fillRect(near.x+13,ny-2,22,24);ctx.fillStyle='#fff';ctx.fillRect(near.x+15,ny,18,20);ctx.fillStyle='#111';ctx.font='22px VT323, monospace';ctx.fillText('!',near.x+21,ny+16)}
 for(const p of P){ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+(1-p.l/p.m)*p.gr),0,7);ctx.fill()}ctx.globalAlpha=1;
 ctx.globalCompositeOperation='lighter';
 for(const[lx,ly]of LAMPS){const fl=.2+Math.sin(time/130+lx)*.03+Math.random()*.02;const g=ctx.createRadialGradient(lx+3,ly,4,lx+3,ly,120);g.addColorStop(0,`rgba(255,170,70,${fl+.18})`);g.addColorStop(1,'rgba(255,170,70,0)');ctx.fillStyle=g;ctx.fillRect(lx-120,ly-120,246,240)}
 ctx.globalCompositeOperation='source-over';
 ctx.restore();
 ctx.fillStyle='rgba(8,14,44,.34)';ctx.fillRect(0,0,VW,VH);
 requestAnimationFrame(frame)}

addEventListener('keydown',e=>{
 wake();const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;
 if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
 if(k===' '||k==='Enter'||k==='z')advance();
 if(k==='e'){if(D)advance();else if(near)talk(near)}
 if(k==='m'){audioOn=!audioOn;if(audioOn)bgMusic.play().catch(()=>{});else bgMusic.pause();$('musicHint').textContent=audioOn?'Music: ON [M to toggle]':'Music: OFF [M to toggle]'}
});
addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
initGame();requestAnimationFrame(frame);
</script>
