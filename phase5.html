<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Thirteen - Act 5: Saratoga</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box
}

body{
    background:#000;
    overflow:hidden;
    font-family:'VT323',monospace;
    color:#fff
}

#gameContainer{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center
}

canvas#gameCanvas{
    background:#111;
    image-rendering:pixelated;
    box-shadow:0 0 50px #000
}

#vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(
            circle,
            rgba(0,0,0,0) 45%,
            rgba(20,10,5,.72) 100%
        );
    box-shadow:inset 0 0 100px #000;
    z-index:10
}

#sceneTitle{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    font-size:24px;
    color:#d4a574;
    letter-spacing:3px;
    text-shadow:2px 2px #000;
    z-index:15
}

#musicHint{
    position:absolute;
    top:20px;
    left:20px;
    font-size:16px;
    color:#aaa;
    z-index:15
}

#dialogueBox{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:800px;
    height:160px;
    background:#000;
    border:4px solid #fff;
    border-radius:10px;
    padding:20px;
    display:none;
    z-index:20
}

#dialogueBox.active{
    display:flex;
    align-items:flex-start;
    gap:20px
}

#speakerPortrait{
    width:100px;
    height:100px;
    border:2px solid #555;
    background:#222;
    image-rendering:pixelated
}

#textContainer{
    flex:1;
    display:flex;
    flex-direction:column
}

#speakerName{
    font-size:24px;
    color:#f4c89a;
    margin-bottom:10px;
    text-transform:uppercase;
    letter-spacing:2px
}

#dialogueText{
    font-size:28px;
    line-height:1.1;
    color:#fff;
    white-space:pre-wrap
}

#dialogueText.nar{
    font-style:italic;
    color:#aaa
}

#continueIndicator{
    position:absolute;
    bottom:10px;
    right:20px;
    font-size:24px;
    animation:bounce .5s infinite alternate;
    display:none
}

@keyframes bounce{
    from{transform:translateY(0)}
    to{transform:translateY(5px)}
}

#flash{
    position:absolute;
    inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
    z-index:30
}

#fadeToBlack{
    position:absolute;
    inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    z-index:40;
    transition:opacity:3s ease
}

#loadingNextPhase{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:32px;
    color:#d4a574;
    text-align:center;
    display:none;
    z-index:50
}
</style>
</head>

<canvas id="gameCanvas"></canvas>

</div>

<div id="musicHint">

<div id="dialogueBox">

</div>

<audio id="bgMusic"
       src="music/himnousa.mp3"
       loop
       preload="auto"></audio>

<script>

const $=id=>document.getElementById(id);

const cv=$('gameCanvas');
const ctx=cv.getContext('2d');

const VW=800;
const VH=600;

cv.width=VW;
cv.height=VH;

function fit(){

    const s=Math.min(
        innerWidth/VW,
        innerHeight/VH
    );

    cv.style.width=VW*s+'px';
    cv.style.height=VH*s+'px';
}

addEventListener('resize',fit);
fit();


/* =========================
   AUDIO
========================= */

const bgMusic=$('bgMusic');

bgMusic.volume=.4;

let audioOn=true;

const AC=new(
    window.AudioContext||
    window.webkitAudioContext
)();

const nb=AC.createBuffer(
    1,
    AC.sampleRate,
    AC.sampleRate
);

{
    const d=nb.getChannelData(0);

    for(let i=0;i<d.length;i++)
        d[i]=Math.random()*2-1;
}

function sfx(){

    if(!audioOn || AC.state!=='running')
        return;

    const o=AC.createOscillator();
    const g=AC.createGain();

    const n=AC.currentTime;

    o.type='square';
    o.frequency.value=380+Math.random()*80;

    g.gain.setValueAtTime(.035,n);
    g.gain.exponentialRampToValueAtTime(
        .001,
        n+.05
    );

    o.connect(g);
    g.connect(AC.destination);

    o.start(n);
    o.stop(n+.05);
}

function cannonSfx(){

    if(!audioOn || AC.state!=='running')
        return;

    const s=AC.createBufferSource();
    s.buffer=nb;

    const f=AC.createBiquadFilter();
    f.type='lowpass';
    f.frequency.value=900;

    const g=AC.createGain();
    const n=AC.currentTime;

    g.gain.setValueAtTime(.45,n);
    g.gain.exponentialRampToValueAtTime(
        .001,
        n+.5
    );

    s.connect(f);
    f.connect(g);
    g.connect(AC.destination);

    s.start(n);
    s.stop(n+.5);
}

function wake(){

    AC.resume();

    if(audioOn && bgMusic.paused)
        bgMusic.play().catch(()=>{});
}

addEventListener('click',wake);
addEventListener('keydown',wake);


/* =========================
   PARTICLES
========================= */

let particles=[];

function smoke(x,y){

    for(let i=0;i<12;i++){

        particles.push({

            x:x+(Math.random()-.5)*18,

            y:y+(Math.random()-.5)*10,

            vx:(Math.random()-.5)*.8,

            vy:-Math.random()*1.3-.3,

            life:45+Math.random()*45,

            max:90,

            r:3+Math.random()*7
        });
    }
}

function sparks(x,y){

    for(let i=0;i<18;i++){

        particles.push({

            x:x,
            y:y,

            vx:(Math.random()-.5)*4,
            vy:(Math.random()-.5)*4,

            life:20+Math.random()*20,
            max:40,

            r:1+Math.random()*2,

            spark:true
        });
    }
}


/* =========================
   PIXEL CHARACTERS
========================= */

const LOOK={

    gates:{
        skin:'#ead5bf',
        hair:'#5a4030',
        coat:'#4b5e4d',
        pants:'#252525',
        hat:'#3a3025'
    },

    british:{
        skin:'#f1dcc8',
        hair:'#111',
        coat:'#9b2e25',
        pants:'#222',
        hat:'#292929'
    },

    german:{
        skin:'#e5cdb9',
        hair:'#38281f',
        coat:'#394d72',
        pants:'#242424',
        hat:'#303030'
    },

    american:{
        skin:'#ead6c2',
        hair:'#35251c',
        coat:'#566c42',
        pants:'#252525'
    }
};


function drawPerson(
    c,
    fx,
    fy,
    o,
    face,
    t,
    s,
    x
){

    c.save();

    c.translate(fx,fy);
    c.scale(s,s);

    const R=(a,b,w,h,col)=>{

        c.fillStyle='#111';

        c.fillRect(
            a-1.5,
            b-1.5,
            w+3,
            h+3
        );

        c.fillStyle=col;

        c.fillRect(
            a,
            b,
            w,
            h
        );
    };

    const moving=x.moving;

    const sw=moving?
        Math.sin(t)*2:
        0;

    /* shadow */

    c.fillStyle='rgba(0,0,0,.35)';

    c.beginPath();

    c.ellipse(
        0,
        0,
        13,
        4,
        0,
        0,
        7
    );

    c.fill();

    /* legs */

    R(
        -7,
        -9+sw,
        5,
        9,
        o.pants
    );

    R(
        2,
        -9-sw,
        5,
        9,
        o.pants
    );

    /* torso */

    R(
        -9,
        -24,
        18,
        15,
        o.coat
    );

    /* arms */

    R(
        -13,
        -23,
        4,
        11,
        o.coat
    );

    R(
        9,
        -23,
        4,
        11,
        o.coat
    );

    /* head */

    R(
        -14,
        -50,
        28,
        26,
        o.skin
    );

    /* hair */

    c.fillStyle=o.hair;

    c.fillRect(
        -14,
        -50,
        28,
        8
    );

    c.fillRect(
        -14,
        -42,
        5,
        8
    );

    c.fillRect(
        9,
        -42,
        5,
        8
    );

    /* eyes */

    c.fillStyle='#111';

    c.fillRect(
        -7,
        -38,
        4,
        5
    );

    c.fillRect(
        4,
        -38,
        4,
        5
    );

    /* mouth */

    c.fillRect(
        -2,
        -30,
        5,
        2
    );

    /* hat */

    if(o.hat){

        c.fillStyle=o.hat;

        c.fillRect(
            -15,
            -57,
            30,
            6
        );

        c.fillRect(
            -9,
            -64,
            18,
            9
        );

        c.fillRect(
            -14,
            -60,
            6,
            7
        );

        c.fillRect(
            8,
            -60,
            6,
            7
        );
    }

    c.restore();
}


/* =========================
   BACKGROUND
========================= */

function drawSky(){

    const g=ctx.createLinearGradient(
        0,
        0,
        0,
        350
    );

    g.addColorStop(0,'#334b45');
    g.addColorStop(.55,'#60735c');
    g.addColorStop(1,'#8a805c');

    ctx.fillStyle=g;

    ctx.fillRect(
        0,
        0,
        VW,
        350
    );
}


function drawMountains(){

    ctx.fillStyle='#38483f';

    ctx.beginPath();

    ctx.moveTo(0,330);

    for(let x=0;x<=800;x+=70){

        const y=
            265+
            Math.sin(x*.018)*30+
            Math.sin(x*.043)*15;

        ctx.lineTo(x,y);
    }

    ctx.lineTo(800,360);
    ctx.lineTo(0,360);

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle='#2d3a35';

    ctx.beginPath();

    ctx.moveTo(0,350);

    for(let x=0;x<=800;x+=55){

        const y=
            300+
            Math.sin(x*.03)*25;
        
        ctx.lineTo(x,y);
    }

    ctx.lineTo(800,400);
    ctx.lineTo(0,400);

    ctx.closePath();

    ctx.fill();
}


function drawGround(){

    ctx.fillStyle='#554b35';

    ctx.fillRect(
        0,
        350,
        800,
        250
    );

    /* grass */

    for(let i=0;i<260;i++){

        const x=Math.random()*800;
        const y=350+Math.random()*180;

        ctx.fillStyle=
            Math.random()>.5?
            '#687052':
            '#3f4b38';

        ctx.fillRect(
            x,
            y,
            2,
            5+Math.random()*8
        );
    }

    /* road */

    ctx.fillStyle='#66563c';

    ctx.beginPath();

    ctx.moveTo(270,350);
    ctx.lineTo(530,350);
    ctx.lineTo(680,600);
    ctx.lineTo(100,600);

    ctx.closePath();

    ctx.fill();

    for(let y=390;y<600;y+=35){

        ctx.fillStyle='rgba(30,20,10,.18)';

        ctx.fillRect(
            130-(y-390)*.15,
            y,
            520,
            3
        );
    }
}


function drawFarm(){

    /* farmhouse */

    ctx.fillStyle='#62452d';

    ctx.fillRect(
        270,
        275,
        260,
        115
    );

    /* roof */

    ctx.fillStyle='#38271e';

    ctx.beginPath();

    ctx.moveTo(245,280);
    ctx.lineTo(400,205);
    ctx.lineTo(555,280);

    ctx.closePath();

    ctx.fill();

    /* beams */

    ctx.fillStyle='#3b281c';

    ctx.fillRect(
        280,
        290,
        240,
        10
    );

    ctx.fillRect(
        385,
        275,
        12,
        115
    );

    /* windows */

    for(const x of[300,455]){

        ctx.fillStyle='#1a1714';

        ctx.fillRect(
            x,
            315,
            48,
            38
        );

        ctx.fillStyle='#9c8055';

        ctx.fillRect(
            x+4,
            319,
            40,
            30
        );

        ctx.fillStyle='#29231b';

        ctx.fillRect(
            x+22,
            319,
            4,
            30
        );

        ctx.fillRect(
            x+4,
            333,
            40,
            4
        );
    }

    /* door */

    ctx.fillStyle='#291c14';

    ctx.fillRect(
        380,
        335,
        42,
        55
    );

    ctx.fillStyle='#b9975c';

    ctx.fillRect(
        412,
        360,
        4,
        4
    );


    /* barn */

    ctx.fillStyle='#79352d';

    ctx.fillRect(
        590,
        300,
        150,
        100
    );

    ctx.fillStyle='#3b251d';

    ctx.beginPath();

    ctx.moveTo(570,300);
    ctx.lineTo(665,250);
    ctx.lineTo(760,300);

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle='#2b2018';

    ctx.fillRect(
        625,
        330,
        80,
        70
    );

    ctx.strokeStyle='#7b5a3b';

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(625,330);
    ctx.lineTo(705,400);

    ctx.moveTo(705,330);
    ctx.lineTo(625,400);

    ctx.stroke();
}


function drawBattlefield(){

    /* smoke clouds */

    for(let i=0;i<8;i++){

        const x=80+i*100;
        const y=290+Math.sin(time*.001+i)*15;

        ctx.fillStyle='rgba(190,190,175,.09)';

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            30+Math.sin(time*.001+i)*5,
            0,
            7
        );

        ctx.fill();
    }

    /* cannon */

    ctx.fillStyle='#171717';

    ctx.fillRect(
        90,
        455,
        75,
        12
    );

    ctx.fillRect(
        125,
        445,
        15,
        15
    );

    ctx.fillStyle='#4b3927';

    ctx.fillRect(
        105,
        468,
        15,
        18
    );

    ctx.fillRect(
        145,
        468,
        15,
        18
    );

    /* wheels */

    ctx.strokeStyle='#211a13';

    ctx.lineWidth=8;

    ctx.beginPath();

    ctx.arc(110,482,16,0,7);
    ctx.arc(155,482,16,0,7);

    ctx.stroke();


    /* flags */

    ctx.fillStyle='#272018';

    ctx.fillRect(
        210,
        240,
        4,
        125
    );

    ctx.fillRect(
        650,
        220,
        4,
        125
    );

    ctx.fillStyle='#4c713e';

    ctx.fillRect(
        214,
        245,
        60,
        30
    );

    ctx.fillStyle='#8b3028';

    ctx.fillRect(
        654,
        225,
        60,
        30
    );
}


/* =========================
   CHARACTERS
========================= */

const gates={
    x:325,
    y:460,
    face:'right',
    moving:false,
    t:0,
    look:LOOK.gates
};

const americans=[
    {x:250,y:470,face:'right',t:0,look:LOOK.american},
    {x:210,y:500,face:'right',t:1,look:LOOK.american},
    {x:300,y:510,face:'right',t:2,look:LOOK.american},
    {x:370,y:500,face:'left',t:3,look:LOOK.american}
];

const germans=[
    {x:570,y:455,face:'left',t:0,look:LOOK.german},
    {x:620,y:490,face:'left',t:1,look:LOOK.german},
    {x:680,y:470,face:'left',t:2,look:LOOK.german}
];

const british=[
    {x:710,y:440,face:'left',t:0,look:LOOK.british},
    {x:740,y:475,face:'left',t:1,look:LOOK.british},
    {x:660,y:520,face:'left',t:2,look:LOOK.british}
];


function drawArmy(){

    drawPerson(
        ctx,
        gates.x,
        gates.y,
        gates.look,
        gates.face,
        gates.t,
        1.15,
        gates
    );

    for(const a of americans){

        drawPerson(
            ctx,
            a.x,
            a.y,
            a.look,
            a.face,
            a.t,
            .9,
            a
        );
    }

    for(const g of germans){

        drawPerson(
            ctx,
            g.x,
            g.y,
            g.look,
            g.face,
            g.t,
            .9,
            g
        );
    }

    for(const b of british){

        drawPerson(
            ctx,
            b.x,
            b.y,
            b.look,
            b.face,
            b.t,
            .9,
            b
        );
    }
}


/* =========================
   DIALOGUE
========================= */

let D=null;
let typeT=null;

const box=$('dialogueBox');
const speakerName=$('speakerName');
const txt=$('dialogueText');
const cont=$('continueIndicator');

const por=$('speakerPortrait');
const pC=por.getContext('2d');

function drawPort(L,open){

    pC.fillStyle='#2a2118';

    pC.fillRect(
        0,
        0,
        64,
        64
    );

    drawPerson(
        pC,
        32,
        96,
        L.look,
        'down',
        0,
        1.5,
        {
            ex:open?'open':'neutral'
        }
    );
}


const SCRIPT=[

{
    sp:'October 1777. Saratoga, New York.',
    look:LOOK.gates,
    text:'The British army is powerful, supported by the German army. But the Americans will not give up.'
},

{
    sp:'General Gates',
    look:LOOK.gates,
    text:'Hide in the farm! The Americans will attack the German mercenaries by surprise. We must win this battle!'
},

{
    sp:'Narrator',
    text:'The American army attacks. 600 more men get sent, but they also lose against the Americans. The British resist and take the farm.'
},

{
    sp:'Narrator',
    text:'Later, the Americans bomb the farm with cannons. The British send more men, but the Americans neutralize them and win the battle.'
},

{
    sp:'Narrator',
    text:'The act has ended.'
}
];


let current=0;
let typing=false;
let ready=false;


function showLine(){

    const L=SCRIPT[current];

    speakerName.textContent=L.sp;

    txt.textContent='';

    box.classList.add('active');

    cont.style.display='none';

    por.style.display=L.look?'block':'none';

    txt.className=L.look?'':'nar';

    if(L.look)
        drawPort(L,false);

    let n=0;

    typing=true;
    ready=false;

    clearInterval(typeT);

    typeT=setInterval(()=>{

        if(n<L.text.length){

            txt.textContent+=L.text[n];

            if(n%2===0)
                sfx();

            if(L.look && n%3===0)
                drawPort(
                    L,
                    (n/3|0)%2===0
                );

            n++;

        }else{

            clearInterval(typeT);

            typing=false;
            ready=true;

            cont.style.display='block';
        }

    },28);
}


function battleEffect(step){

    if(step===1){

        for(let i=0;i<6;i++)
            smoke(
                250+Math.random()*350,
                300+Math.random()*100
            );
    }

    if(step===2){

        cannonSfx();

        smoke(110,450);
        sparks(145,450);

        const f=$('flash');

        f.style.opacity=.7;

        setTimeout(()=>{
            f.style.opacity=0;
        },90);
    }

    if(step===3){

        for(let i=0;i<12;i++)
            smoke(
                120+Math.random()*600,
                300+Math.random()*180
            );

        cannonSfx();
    }
}


function advance(){

    if(typing){

        clearInterval(typeT);

        txt.textContent=SCRIPT[current].text;

        typing=false;
        ready=true;

        cont.style.display='block';

        return;
    }

    if(!ready)
        return;

    current++;

    if(current>=SCRIPT.length){

        finish();

    }else{

        if(current===2)
            battleEffect(1);

        if(current===3)
            battleEffect(2);

        if(current===4)
            battleEffect(3);

        showLine();
    }
}


/* =========================
   END
========================= */

function finish(){

    box.classList.remove('active');

    $('fadeToBlack').style.opacity=1;

    let v=.4;

    const fadeMusic=setInterval(()=>{

        v=Math.max(
            0,
            v-.025
        );

        bgMusic.volume=v;

        if(v<=0)
            clearInterval(fadeMusic);

    },100);

    setTimeout(()=>{

        $('loadingNextPhase').style.display='block';

    },2000);

    setTimeout(()=>{

        window.location.href='phase6.html';

    },3500);
}


/* =========================
   INPUT
========================= */

addEventListener('keydown',e=>{

    wake();

    if(
        e.key===' '||
        e.key==='Enter'||
        e.key.toLowerCase()==='z'
    ){

        e.preventDefault();

        advance();
    }

    if(e.key.toLowerCase()==='m'){

        audioOn=!audioOn;

        if(audioOn)
            bgMusic.play().catch(()=>{});
        else
            bgMusic.pause();

        $('musicHint').textContent=
            audioOn?
            'Music: ON [M to toggle]':
            'Music: OFF [M to toggle]';
    }

});


addEventListener('mousedown',advance);


/* =========================
   GAME LOOP
========================= */

function frame(){

    time=performance.now();

    ctx.clearRect(
        0,
        0,
        VW,
        VH
    );

    drawSky();
    drawMountains();
    drawGround();
    drawFarm();
    drawBattlefield();
    drawArmy();


    /* particles */

    for(const p of particles){

        p.x+=p.vx;
        p.y+=p.vy;

        p.vy-=.005;

        p.life--;

        const alpha=Math.max(
            0,
            p.life/p.max
        );

        ctx.globalAlpha=alpha;

        ctx.fillStyle=
            p.spark?
            '#d8a44a':
            '#aaa';

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.r,
            0,
            7
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;

    particles=
        particles.filter(p=>p.life>0);


    if(Math.random()<.025){

        smoke(
            180+Math.random()*500,
            270+Math.random()*100
        );
    }


    ctx.fillStyle='rgba(180,150,100,.045)';

    ctx.fillRect(
        0,
        0,
        VW,
        VH
    );


    requestAnimationFrame(frame);
}


frame();

bgMusic.play().catch(()=>{});

showLine();

</script>
</body>
</html>
