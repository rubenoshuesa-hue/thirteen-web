function wake(){

 }

function sfx(k){
 if(!audioOn||!AC||AC.state!=='running')return;

 if(k==='blip'){
  const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
  o.type='square';
  o.frequency.value=380+Math.random()*80;
  g.gain.setValueAtTime(.04,n);
  g.gain.exponentialRampToValueAtTime(.001,n+.05);
  o.connect(g);
  g.connect(AC.destination);
  o.start(n);
  o.stop(n+.05);
 }

 if(k==='paper'){
  const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
  o.type='triangle';
  o.frequency.setValueAtTime(500,n);
  o.frequency.exponentialRampToValueAtTime(180,n+.12);
  g.gain.setValueAtTime(.035,n);
  g.gain.exponentialRampToValueAtTime(.001,n+.13);
  o.connect(g);
  g.connect(AC.destination);
  o.start(n);
  o.stop(n+.13);
 }

 if(k==='crowd'){
  const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
  o.type='sawtooth';
  o.frequency.value=100;
  g.gain.setValueAtTime(.025,n);
  g.gain.exponentialRampToValueAtTime(.001,n+.4);
  o.connect(g);
  g.connect(AC.destination);
  o.start(n);
  o.stop(n+.4);
 }
}

function drawPerson(c,fx,fy,o,face,t,s,x){

 c.translate(0,m?-Math.abs(Math.cos(t))*1.5:0);

  c.fillStyle='#111';
  c.fillRect(a-1.5,b-1.5,w+3,h+3);
  c.fillStyle=col;
  c.fillRect(a,b,w,h);
 };

 const ex=x.ex||'neutral';

 if(!o.dress){
  const pc=o.pants||'#222';

  if(side){
   for(const k of[1,-1])R(-3+k*sw*1.2,-9,6,9,pc);
  }else{
   R(-7,-9+sw*.3,5,9-sw*.3,pc);
   R(2,-9-sw*.3,5,9+sw*.3,pc);
  }
 }else{
  R(-6,-3,5,3,'#222');
  R(1,-3,5,3,'#222');
 }

 R(cx,-24,tw,o.dress?21:15,o.coat);

 if(!back){
  const d=o.deco;

  if(d==='rainbow'&&!side){
   c.fillStyle='#2ecc71';
   c.fillRect(-3,-23,2,13);
   c.fillStyle='#f1c40f';
   c.fillRect(-1,-23,2,13);
   c.fillStyle='#e74c3c';
   c.fillRect(1,-23,2,13);
  }
  else if(d==='xbelt'){
   c.strokeStyle='#eee';
   c.lineWidth=2.5;
   c.beginPath();
   c.moveTo(cx+1,-23);
   c.lineTo(-cx-1,-10);
   if(!side){
    c.moveTo(-cx-1,-23);
    c.lineTo(cx+1,-10);
   }
   c.stroke();
  }
  else if(d==='captain'){
   c.fillStyle='#e5bd55';

   c.fillRect(-1,-20,2,2);

 if(side){

  R(-cx+1,-23-as,4,10,o.coat);
 }

 const hy=-50,hw=side?26:28,hx0=-hw/2;

 if(o.hat==='hood')R(-17,-53,34,30,o.hc);

 R(hx0,hy,hw,26,o.skin);

 c.fillStyle=o.hair;

 if(back){

class Ent{
 constructor(x,y,k,o={}){
  Object.assign(this,{
   x,y,k,o:LOOK[k],
   face:'down',
   t:Math.random()*6,
   moving:false,
   speed:.9,
   timer:20+Math.random()*100|0,
   zone:null,
   fallen:false,
   lines:[],
   barks:[],
   bark:null,
   barkL:0,
   barkT:200+Math.random()*600|0,
   tx:null,ty:null,
   stuck:0,
   ctrl:false,
   free:false,
   talking:false
  },o);
 }

 mv(tx,ty,sp){
  const dx=tx-this.x,dy=ty-this.y;
  const d=Math.hypot(dx,dy);

  if(d<=sp){
   this.tx=null;
   this.moving=false;
   return true;
  }

  const ox=this.x,oy=this.y;
  const vx=dx/d*sp,vy=dy/d*sp;

  if(this.free){
   this.x+=vx;
   this.y+=vy;
  }else{
   if(!blocked(this.x+vx,this.y))this.x+=vx;
   if(!blocked(this.x,this.y+vy))this.y+=vy;
  }

  this.moving=true;
  this.t+=.2*sp+.05;

  if(Math.abs(vx)>Math.abs(vy)){
   this.face=vx>0?'right':'left';
  }else{
   this.face=vy>0?'down':'up';
  }

  if(ox===this.x&&oy===this.y){
   if(++this.stuck>25){
    this.stuck=0;
    this.tx=null;
    this.moving=false;
    return true;
   }
  }else this.stuck=0;

  return false;
 }

 update(){
  if(this.fallen)return;

  if(this.ctrl){
   if(this.tx!=null)this.mv(this.tx,this.ty,this.run||this.speed);
   else this.moving=false;
   return;
  }

  if(this.talking||!this.zone){
   this.moving=false;
   return;
  }

  if(this.tx==null){
   this.moving=false;

   if(--this.timer<=0){
    const z=this.zone;

    for(let i=0;i<12;i++){
     const nx=z[0]+Math.random()*(z[2]-z[0]);
     const ny=z[1]+Math.random()*(z[3]-z[1]);

     if(!blocked(nx,ny)){
      this.tx=nx;
      this.ty=ny;
      break;
     }
    }

    this.timer=40+Math.random()*220|0;
   }
  }else if(this.mv(this.tx,this.ty,this.speed)){
   this.tx=null;
   this.timer=60+Math.random()*240|0;
  }
 }

 draw(c){
  this.ex=this.talking&&(time/160|0)%2?'open':(this.expr||'neutral');

  drawPerson(
   c,
   this.x+24,
   this.y+48,
   this.o,
   this.face,
   this.t,
   this.o.scale||1,
   this
  );
 }
}

let D=null,typeT=null;

const box=$('dialogueBox');

function drawPort(L,open){
 pC.fillStyle='#2a2118';
 pC.fillRect(0,0,64,64);

 drawPerson(
  pC,32,96,L.look||LOOK.delegate,
  'down',0,1.5,{ex:open?'open':(L.expr||'neutral')}
 );
}

function say(lines){
 return new Promise(r=>{
  D={lines,i:0,r,typing:false,ready:false};
  showLine();
 });
}

function showLine(){
 const L=D.lines[D.i];

 if(L.act)L.act();

 box.classList.add('active');
 cont.style.display='none';

 if(L.sp){
  nameEl.textContent=L.sp;
  por.style.display='block';
  txt.className='';
  drawPort(L,false);
 }else{
  nameEl.textContent='';
  por.style.display='none';
  txt.className='nar';
 }

 txt.textContent='';

 let n=0;
 D.typing=true;
 D.ready=false;

 clearInterval(typeT);

 typeT=setInterval(()=>{
  if(n<L.text.length){
   txt.textContent+=L.text[n];

   if(L.sp&&n%3===0){
    drawPort(L,(n/3|0)%2===0);
   }

   if(n%2===0&&L.text[n]!=='')sfx('blip');

   n++;
  }else{
   done();
  }
 },28);
}

function done(){
 clearInterval(typeT);

 D.typing=false;
 D.ready=true;

 const L=D.lines[D.i];

 if(L.sp)drawPort(L,false);

 txt.textContent=L.text;
 cont.style.display='block';

 if(L.auto){
  const d=D,i=D.i;
  setTimeout(()=>{
   if(D===d&&D.i===i)next();
  },L.auto);
 }
}

function advance(){
 if(!D)return;

 if(D.typing)done();
 else if(D.ready)next();
}

function next(){
 D.i++;

 if(D.i>=D.lines.length){
  box.classList.remove('active');
  const r=D.r;
  D=null;
  r();
 }else{
  showLine();
 }
}

async function talk(n){
 if(D||ending)return;

 n.talking=true;
 n.moving=false;

 const dx=player.x-n.x;
 const dy=player.y-n.y;

 n.face=Math.abs(dx)>Math.abs(dy)
  ?(dx>0?'right':'left')
  :(dy>0?'down':'up');

 if(n.isDelegate&&talked.has(n.id)){
  await say([
   {sp:n.name,look:n.o,text:'We have already discussed the future of the Union. The convention awaits.'}
  ]);
  n.talking=false;
  return;
 }

 await say(n.lines.map(text=>({
  sp:n.name,
  look:n.o,
  expr:'neutral',
  text
 })));

 if(n.isDelegate){
  talked.add(n.id);
  sfx('paper');
 }

 n.talking=false;
}

});

 if(player&&!D&&!ending){
  const ax=
   (keys.d||keys.ArrowRight?1:0)-
   (keys.a||keys.ArrowLeft?1:0);

  const ay=
   (keys.s||keys.ArrowDown?1:0)-
   (keys.w||keys.ArrowUp?1:0);

  if(ax||ay){
   const n=Math.hypot(ax,ay);
   const vx=ax/n*player.speed;
   const vy=ay/n*player.speed;

   if(!blocked(player.x+vx,player.y))player.x+=vx;
