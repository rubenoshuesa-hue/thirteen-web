const SOLIDS=[
    [-50,-50,MW+100,250],

function blocked(x,y){

/* =========================================================
   AUDIO — SOLO SFX
========================================================= */

let audioOn=true;

const AC=new(window.AudioContext||window.webkitAudioContext)();

const nb=AC.createBuffer(
    1,
    AC.sampleRate,
    AC.sampleRate
);

{
    const d=nb.getChannelData(0);

    for(let i=0;i<d.length;i++)
        d[i]=Math.random()*2-1;
}

function wake(){
    AC.resume()
}

addEventListener('click',wake);

function noise(dur,vol,fq,type='lowpass'){

    if(!audioOn||AC.state!=='running')return;

    const s=AC.createBufferSource();
    s.buffer=nb;

    const f=AC.createBiquadFilter();
    f.type=type;
    f.frequency.value=fq;

    const g=AC.createGain();
    const n=AC.currentTime;

    g.gain.setValueAtTime(vol,n);
    g.gain.exponentialRampToValueAtTime(.001,n+dur);

    s.connect(f);
    f.connect(g);
    g.connect(AC.destination);

    s.start(n);
    s.stop(n+dur)
}

function sfx(k){

    if(!audioOn||AC.state!=='running')return;

    if(k==='blip'){

        const o=AC.createOscillator();
        const g=AC.createGain();
        const n=AC.currentTime;

        o.type='square';
        o.frequency.value=380+Math.random()*80;

        g.gain.setValueAtTime(.04,n);
        g.gain.exponentialRampToValueAtTime(.001,n+.05);

        o.connect(g);
        g.connect(AC.destination);

        o.start(n);
        o.stop(n+.05)

    }

    else if(k==='shot'){
        noise(.35,.55,1800+Math.random()*900)
    }

    else if(k==='hit'){
        noise(.15,.25,700,'bandpass')
    }

    else if(k==='boom'){
        noise(.7,.5,250)
    }
}

/* =========================================================
   PIXEL PERSON
========================================================= */

function drawPerson(c,fx,fy,o,face,t,s,x){

    c.save();

    c.translate(fx,fy);
    c.scale(s,s);

    c.fillStyle='rgba(0,0,0,.35)';
    c.beginPath();
    c.ellipse(
        0,
        0,
        x.fallen?28:12,
        4,
        0,0,7
    );
    c.fill();

    if(x.fallen)
        c.rotate((x.fdir||1)*Math.PI/2);

    const side=
        face==='left'||
        face==='right';

    const dr=
        face==='left'?-1:1;

    const back=face==='up';

    const R=(a,b,w,h,col)=>{

        c.fillStyle='#111';
        c.fillRect(
            a-1.5,
            b-1.5,
            w+3,
            h+3
        );

        c.fillStyle=col;
        c.fillRect(a,b,w,h)
    };

    const m=x.moving&&!x.fallen;
    const sw=m?Math.sin(t)*3:0;

    const tw=side?12:18;
    const cx=-tw/2;

    const ex=x.ex||'neutral';


    /* LEGS */

    if(!o.dress){

        const pc=o.pants||'#222';

        if(side){

            for(const k of[1,-1])
                R(
                    -3+k*sw*1.2,
                    -9,
                    6,
                    9,
                    pc
                )

        }else{

            R(
                -7,
                -9+sw*.3,
                5,
                9-sw*.3,
                pc
            );

            R(
                2,
                -9-sw*.3,
                5,
                9+sw*.3,
                pc
            )
        }
    }


    /* BODY */

    R(
        cx,
        -24,
        tw,
        15,
        o.coat
    );


    /* DECORATION */

    if(!back){

        if(o.deco==='rainbow'&&!side){

            c.fillStyle='#2ecc71';
            c.fillRect(-3,-23,2,13);

            c.fillStyle='#f1c40f';
            c.fillRect(-1,-23,2,13);

            c.fillStyle='#e74c3c';
            c.fillRect(1,-23,2,13)
        }

        else if(o.deco==='gold'){

            c.fillStyle='#e6c65c';
            c.fillRect(cx+2,-23,tw-4,3);

            c.fillRect(cx+3,-16,tw-6,2)
        }

        else if(o.deco==='xbelt'){

            c.strokeStyle='#eee';
            c.lineWidth=2.5;

            c.beginPath();

            c.moveTo(cx+1,-23);
            c.lineTo(-cx-1,-10);

            if(!side){

                c.moveTo(-cx-1,-23);
                c.lineTo(cx+1,-10)
            }

            c.stroke()
        }
    }


    /* ARMS */

    const as=m?Math.sin(t)*2:0;

    if(side){

        R(
            -2-sw,
            -23,
            4,
            10,
            o.coat
        )

    }else{

        R(
            cx-5,
            -23+as,
            4,
            10,
            o.coat
        );

        R(
            -cx+1,
            -23-as,
            4,
            10,
            o.coat
        )
    }


    /* HEAD */

    const hy=-50;
    const hw=side?26:28;
    const hx0=-hw/2;

    R(
        hx0,
        hy,
        hw,
        26,
        o.skin
    );

    c.fillStyle=o.hair;

    if(back){

        c.fillRect(
            hx0,
            hy,
            hw,
            24
        )

    }else if(side){

        c.fillRect(
            hx0,
            hy,
            hw,
            9
        );

        c.fillRect(
            dr>0?hx0:hx0+hw-13,
            hy+9,
            13,
            12
        )

    }else{

        c.fillRect(
            hx0,
            hy,
            hw,
            9
        );

        c.fillRect(
            hx0,
            hy+9,
            5,
            9
        );

        c.fillRect(
            hx0+hw-5,
            hy+9,
            5,
            9
        )
    }


    /* FACE */

    if(!back){

        const xs=side?[dr*6]:[-6,6];

        for(const e0 of xs){

            c.fillStyle='#111';

            c.fillRect(
                e0-2,
                -38,
                4,
                5
            )
        }

        c.fillRect(
            side?dr*7-2:-2,
            -30,
            4,
            2
        )
    }


    /* HAT */

    if(o.hat==='band'){

        c.fillStyle=o.hc;
        c.fillRect(
            hx0,
            -45,
            hw,
            5
        )
    }


    /* MUSKET */

    if(o.musket){

        const a=x.aim??-Math.PI/2;

        c.save();

        c.translate(dr*5,-16);
        c.rotate(a);

        c.fillStyle='#111';
        c.fillRect(
            -9,-2.5,
            44,5
        );

        c.fillStyle='#7a4a22';
        c.fillRect(
            -8,-1.5,
            24,3
        );

        c.fillStyle='#777';
        c.fillRect(
            16,-1,
            18,2
        );

        c.fillStyle='#ddd';
        c.fillRect(
            35,-.6,
            7,1.2
        );

        c.restore()
    }

    c.restore()
}

let E=[];

class Ent{

    constructor(x,y,k,o={}){

        Object.assign(
            this,
            {
                x,
                y,
                k,
                o:LOOK[k],

                face:'down',
                t:Math.random()*6,

                moving:false,
                speed:.9,

                timer:40+Math.random()*100|0,

                zone:null,

                fallen:false,

                lines:[],
                barks:[],

                bark:null,
                barkL:0,
                barkT:300,

                tx:null,
                ty:null,

                ctrl:false,
                free:false,

                talking:false,

                hp:1
            },
            o
        )
    }


    mv(tx,ty,sp){

        const dx=tx-this.x;
        const dy=ty-this.y;

        const d=Math.hypot(dx,dy);

        if(d<=sp){

            this.tx=null;
            this.moving=false;

            return true
        }

        const vx=dx/d*sp;
        const vy=dy/d*sp;

        if(
            this.free ||
            !blocked(this.x+vx,this.y)
        )
            this.x+=vx;

        if(
            this.free ||
            !blocked(this.x,this.y+vy)
        )
            this.y+=vy;

        this.moving=true;

        this.t+=.2;

        if(Math.abs(vx)>Math.abs(vy))
            this.face=vx>0?'right':'left';
        else
            this.face=vy>0?'down':'up';

        return false
    }


    update(){

        if(this.fallen)
            return;

        if(this.ctrl){

            if(this.tx!=null)
                this.mv(
                    this.tx,
                    this.ty,
                    this.run||this.speed
                );

            return
        }

        if(!this.zone)
            return;

        if(this.tx==null){

            if(--this.timer<=0){

                const z=this.zone;

                this.tx=
                    z[0]+Math.random()*z[2];

                this.ty=
                    z[1]+Math.random()*z[3];

                this.timer=
                    80+Math.random()*180|0
            }

        }else{

            this.mv(
                this.tx,
                this.ty,
                this.speed
            )
        }
    }


    draw(c){

        this.ex=
            this.fallen?
            'pain':
            this.expr||'neutral';

        drawPerson(
            c,
            this.x+24,
            this.y+48,
            this.o,
            this.face,
            this.t,
            this.o.scale||1,
            this
        )
    }
}


function mk(name,x,y,k,o={}){

    const e=new Ent(

        y,
        k,
        Object.assign({name},o)
    );

    E.push(e);

    return e
}

/* =========================================================
   BULLETS
========================================================= */

function fire(shooter,target){

    const fx=shooter.x+24;
    const fy=shooter.y+30;

    let tx,ty;

    if(target){

        tx=target.x+24;
        ty=target.y+25

    }else{

        const a=
            shooter.face==='left'?
            Math.PI:
            0;

        tx=fx+Math.cos(a)*600;
        ty=fy
    }

    const angle=Math.atan2(
        ty-fy,
        tx-fx
    );

    shooter.aim=angle;

    const muzzleX=
        fx+Math.cos(angle)*35;

    const muzzleY=
        fy+Math.sin(angle)*35;

    particles.push({
        x:muzzleX,
        y:muzzleY,
        vx:0,
        vy:0,
        l:5,
        m:5,
        r:10,
        c:'#ffd27a'
    });

    bullets.push({

        x:muzzleX,
        y:muzzleY,

        vx:Math.cos(angle)*18,
        vy:Math.sin(angle)*18,

        owner:shooter,

        target,

        life:80
    });

    sfx('shot');

    screenShake=7
}


/* =========================================================
   DIALOGUE
========================================================= */

let D=null;
let typeT=null;

const box=$('dialogueBox');
const nameEl=$('speakerName');
const txt=$('dialogueText');
const cont=$('continueIndicator');

const por=$('speakerPortrait');
const pC=por.getContext('2d');


function drawPort(L,open){

    pC.fillStyle='#2a2118';
    pC.fillRect(
        0,0,64,64
    );

    drawPerson(
        pC,
        32,
        96,
        L.look,
        'down',
        0,
        1.5,
        {
            ex:open?'open':(L.expr||'neutral'),
            fallen:false
        }
    )
}


function say(lines){

    return new Promise(resolve=>{

        D={
            lines,
            i:0,
            resolve,
            typing:false,
            ready:false
        };

        showLine()
    })
}


function showLine(){

    const L=D.lines[D.i];

    if(L.act)
        L.act();

    box.classList.add('active');

    cont.style.display='none';

    if(L.sp){

        nameEl.textContent=L.sp;

        por.style.display='block';

        txt.className='';

        drawPort(
            L,
            false
        )

    }else{

        nameEl.textContent='';

        por.style.display='none';

        txt.className='nar'
    }

    txt.textContent='';

    let n=0;

    D.typing=true;
    D.ready=false;

    clearInterval(typeT);

    typeT=setInterval(()=>{

        if(n<L.text.length){

            txt.textContent+=L.text[n];

            if(
                L.sp &&
                n%3===0
            )
                drawPort(
                    L,
                    (n/3|0)%2===0
                );

            if(
                n%2===0 &&
                L.text[n]!==' '
            )
                sfx('blip');

            n++

        }else{

            done()
        }

    },28)
}


function done(){

    clearInterval(typeT);

    D.typing=false;
    D.ready=true;

    const L=D.lines[D.i];

    if(L.sp)
        drawPort(L,false);

    txt.textContent=L.text;

    cont.style.display='block'
}


function advance(){

    if(!D)return;

    if(D.typing)
        done();

    else if(D.ready)
        next()
}


function next(){

    D.i++;

    if(D.i>=D.lines.length){

        box.classList.remove('active');

        const r=D.resolve;

        D=null;

        r()

    }else{

        showLine()
    }
}

function talk(n){

        lines.map(text=>({

            look:n.o,

/* =========================================================
   BATTLE SCENE
========================================================= */

/* =========================================================
   BATTLE
========================================================= */

function beginBattle(){

    state='battle';

    $('battleHUD').style.display='block';

    $('controls').innerHTML=
        'WASD / ARROWS — MOVE<br>' +
        'SPACE — FIRE';

    $('controls').style.display='block';

    hearts=3;
    kills=0;

    battleEnemies=[];

    /* British line */

    const positions=[
        [1100,450],
        [1250,500],
        [1400,440],
        [1510,550],
        [1180,650],
        [1320,690],
        [1460,720]
    ];

    positions.forEach((p,i)=>{

        const e=new Ent(
            p[0],
            p[1],
            'british',
            {
                name:'British Soldier',
                ctrl:true,
                free:true,
                hp:1,
                speed:0,
                face:'left',
                enemy:true,
                shootTimer:80+i*35
            }
        );

        E.push(e);
        battleEnemies.push(e)
    });

    /* American ally */

    for(const p of[
        [800,470],
        [820,620]
    ]){

        mk(
            'American Soldier',
            p[0],
            p[1],
            'american',
            {
                ctrl:true,
                free:true,
                ally:true,
                face:'right',
                hp:1
            }
        )
    }

    player.x=700;
    player.y=570;

    player.face='right'
}


/* =========================================================
   PLAYER DAMAGE
========================================================= */

function damagePlayer(){

    if(player.invincible)
        return;

    hearts--;

    player.invincible=true;

    setTimeout(()=>{
        player.invincible=false
    },1000);

    $('flash').style.opacity=.7;

    setTimeout(()=>{
        $('flash').style.opacity=0
    },100);

    screenShake=14;

    sfx('hit');

    if(hearts<=0){

        battleLost()

    }
}


async function battleLost(){

    state='lost';

    await say([

        {
            text:
            'The battlefield overwhelms you.\n' +
            'You are forced to retreat.'
        },

        {
            text:
            'Try again.'
        }

    ]);

    hearts=3;

    battleEnemies.forEach(e=>{

        e.fallen=true

    });

    battleEnemies=[];

    E=E.filter(e=>!e.enemy);

    player.x=700;
    player.y=570;

    state='battle';

    beginBattle()
}

   FINISH → PHASE 7

function finishPhase(){

/* =========================================================
   BACKGROUND COLLISION / CAMERA
========================================================= */

let camera={
    x:0,
    y:0
};


/* =========================================================
   GAME LOOP
========================================================= */

const keys={};


function updatePlayer(){

    if(
        state!=='explore' &&
        state!=='battle'
    )
        return;

    const ax=
        (keys.d||keys.ArrowRight?1:0)-
        (keys.a||keys.ArrowLeft?1:0);

    const ay=
        (keys.s||keys.ArrowDown?1:0)-
        (keys.w||keys.ArrowUp?1:0);

    if(ax||ay){

        const n=Math.hypot(ax,ay);

        const sp=state==='battle'
            ?3.4
            :3.0;

        const vx=ax/n*sp;
        const vy=ay/n*sp;

        if(
            !blocked(
                player.x+vx,
                player.y
            )
        )
            player.x+=vx;

        if(
            !blocked(
                player.x,
                player.y+vy
            )
        )
            player.y+=vy;

        player.moving=true;

        player.t+=.26;

        if(Math.abs(ax)>=Math.abs(ay)&&ax)

            player.face=
                ax>0?'right':'left';

        else

            player.face=
                ay>0?'down':'up'

    }else{

        player.moving=false
    }
}


/* =========================================================
   PLAYER SHOOT
========================================================= */

let lastShot=0;

function playerShoot(){

    if(state!=='battle')
        return;

    const now=performance.now();

    if(now-lastShot<500)
        return;

    lastShot=now;

    let target=null;
    let dist=Infinity;

    for(const e of battleEnemies){

        if(e.fallen)
            continue;

        const d=Math.hypot(
            player.x-e.x,
            player.y-e.y
        );

        if(d<dist && d<500){

            dist=d;
            target=e
        }
    }

    if(!target){

        target={
            x:player.x+
                (player.face==='right'?400:-400),
            y:player.y
        }
    }

    fire(
        player,
        target.enemy?target:null
    )
}


/* =========================================================
   ENEMY SHOOTING
========================================================= */

function enemyAI(){

    if(state!=='battle')
        return;

    for(const e of battleEnemies){

        if(e.fallen)
            continue;

        e.shootTimer--;

        e.face='left';

        if(e.shootTimer<=0){

            e.shootTimer=
                90+Math.random()*120;

            const d=Math.hypot(
                player.x-e.x,
                player.y-e.y
            );

            if(d<550){

                fire(e,player)
            }
        }
    }
}


/* =========================================================
   BULLET UPDATE
========================================================= */

function updateBullets(){

    for(const b of bullets){

        b.x+=b.vx;
        b.y+=b.vy;

        b.life--;

        if(
            b.target &&
            !b.target.fallen
        ){

            const d=Math.hypot(
                b.x-(b.target.x+24),
                b.y-(b.target.y+25)
            );

            if(d<20){

                if(b.owner===player){

                    b.target.fallen=true;

                    kills++;

                    puff(
                        b.target.x+24,
                        b.target.y+40
                    );

                    sfx('hit')
                }

                else if(b.target===player){

                    damagePlayer()
                }

                b.life=0
            }
        }
    }

    bullets=
        bullets.filter(
            b=>b.life>0
        )
}


/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld(){

    ctx.drawImage(
        bgc,
        0,
        0
    );

    /* smoke */

    for(let i=0;i<10;i++){

        const x=
            700+
            i*80+
            Math.sin(time/900+i)*20;

        const y=
            480+
            Math.sin(time/500+i)*30;

        ctx.fillStyle=
            'rgba(210,210,210,.08)';

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            25,
            0,
            7
        );

        ctx.fill()
    }
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.save();

    if(screenShake>0){

        ctx.translate(
            (Math.random()-.5)*screenShake,
            (Math.random()-.5)*screenShake
        );

        screenShake=
            Math.max(
                0,
                screenShake-.6
            )
    }

    ctx.fillStyle='#182331';

    ctx.fillRect(
        0,0,VW,VH
    );

    ctx.translate(
        -Math.round(camera.x),
        -Math.round(camera.y)
    );

    drawWorld();


    /* ENTITIES */

    [...E]
    .sort(
        (a,b)=>
            a.y-b.y
    )
    .forEach(
        e=>e.draw(ctx)
    );


    /* BULLETS */

    for(const b of bullets){

        ctx.save();

        ctx.translate(
            b.x,
            b.y
        );

        ctx.rotate(
            Math.atan2(
                b.vy,
                b.vx
            )
        );

        ctx.fillStyle='#111';

        ctx.fillRect(
            -5,
            -2,
            10,
            4
        );

        ctx.fillStyle='#777';

        ctx.fillRect(
            3,
            -1,
            5,
            2
        );

        ctx.restore()
    }


    /* PARTICLES */

    for(const p of particles){

        ctx.globalAlpha=
            p.l/p.m;

        ctx.fillStyle=p.c;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.r,
            0,
            7
        );

        ctx.fill()
    }

    ctx.globalAlpha=1;

    ctx.restore();


    /* BATTLE HUD */

    if(state==='battle'){

        let heartsText='';

        for(let i=0;i<3;i++)
            heartsText+=
                i<hearts?'♥ ':'♡ ';

        $('hearts').textContent=
            heartsText;

        const alive=
            battleEnemies.filter(
                e=>!e.fallen
            ).length;

        $('enemyCount').textContent=
            'ENEMIES: '+alive;

        if(alive===0)
            battleWon()
    }


    /* INTERACTION */

    $('interactionHUD').style.display=
        state==='explore'&&near
        ?'block'
        :'none';

}


/* =========================================================
   MAIN LOOP
========================================================= */

function frame(){

    time=performance.now();

    updatePlayer();

    E.forEach(e=>{

        if(
            e!==player &&
            !e.enemy
        )
            e.update()
    });

    enemyAI();

    updateBullets();

    for(const p of particles){

        p.x+=p.vx;
        p.y+=p.vy;

        p.vy+=.08;

        p.l--
    }

    particles=
        particles.filter(
            p=>p.l>0
        );


    if(state==='explore'){

        near=null;

        let best=70;

        for(const e of E){

            if(
                e===player ||
                e.fallen ||
                e.enemy ||
                e.ally
            )
                continue;

            const d=Math.hypot(
                player.x-e.x,
                player.y-e.y
            );

            if(d<best){

                best=d;
                near=e
            }
        }
    }


    const focusX=
        player.x+24;

    const focusY=
        player.y+24;

    camera.x+=(
        Math.max(
            0,
            Math.min(
                MW-VW,
                focusX-VW/2
            )
        )-
        camera.x
    )*.08;

    camera.y+=(
        Math.max(
            0,
            Math.min(
                MH-VH,
                focusY-VH/2
            )
        )-
        camera.y
    )*.08;


    draw();

    requestAnimationFrame(frame)
}


/* =========================================================
   INITIALIZE
========================================================= */

function initGame(){

    player=new Ent(
        260,
        570,
        'player',
        {
            isPlayer:true,
            speed:3
        }
    );

    E.push(player);


    mk(
        'George Washington',
        430,
        540,
        'washington',
        {
            lines:[
                'The French have arrived, and our army surrounds Yorktown.',
                'If we maintain the siege, Cornwallis will have nowhere left to run.',
                'Speak with the officers, then prepare yourself for battle.'
            ]
        }
    );


    mk(
        'French Officer',
        700,
        450,
        'french',
        {
            lines:[
                'France stands beside the American cause.',
                'Our artillery is ready to strike the British positions.',
                'The alliance may decide the fate of this war.'
            ]
        }
    );


    mk(
        'American Officer',
        900,
        620,
        'officer',
        {
            lines:[
                'The British are preparing their final defense.',
                'When the order comes, we attack.',
                'Keep your musket ready.',
                'Fire when you see them!'
            ],
            startBattle:true
        }
    );


    /* FIRST INTRO */

    setTimeout(()=>{

        openingScene()

    },700)
}


/* =========================================================
   INPUT
========================================================= */

addEventListener(
    'keydown',
    e=>{

        wake();

        const k=
            e.key.length===1
            ?e.key.toLowerCase()
            :e.key;

        keys[k]=true;


        if([
            ' ',
            'ArrowUp',
            'ArrowDown',
            'ArrowLeft',
            'ArrowRight'
        ].includes(e.key))
            e.preventDefault();


        /* DIALOGUE */

        if(
            k===' '||
            k==='Enter'||
            k==='z'
        ){

            advance()
        }


        /* TALK */

        if(k==='e'){

            if(D){

                advance()

            }

            else if(
                state==='explore' &&
                near
            ){

                talk(near)
            }
        }


        /* SHOOT */

        if(
            k===' ' &&
            state==='battle'
        ){

            playerShoot()
        }
    }
);


addEventListener(
    'keyup',
    e=>{

        keys[
            e.key.length===1
            ?e.key.toLowerCase()
            :e.key
        ]=false
    }
);


initGame();

requestAnimationFrame(frame);

</script>
