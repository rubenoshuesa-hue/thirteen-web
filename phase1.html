<!DOCTYPE html>
<html lang="en">

<title>Thirteen - Act 1: Boston Harbor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'VT323',monospace;color:#fff}
#gameContainer{position:relative;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center}
canvas#gameCanvas{background:#111;image-rendering:pixelated;box-shadow:0 0 50px #000}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(0,0,0,0) 50%,rgba(26,15,10,.8) 100%);box-shadow:inset 0 0 100px #000;z-index:10}
#dialogueBox{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:90%;max-width:800px;height:160px;background:#000;border:4px solid #fff;border-radius:10px;padding:20px;display:none;z-index:20}
#dialogueBox.active{display:flex;align-items:flex-start;gap:20px}
#speakerPortrait{width:100px;height:100px;border:2px solid #555;background:#222;image-rendering:pixelated}
#textContainer{flex:1;display:flex;flex-direction:column}
#speakerName{font-size:24px;color:#f4c89a;margin-bottom:10px;text-transform:uppercase;letter-spacing:2px}
#dialogueText{font-size:28px;line-height:1.1;color:#fff;white-space:pre-wrap}
#dialogueText.nar{font-style:italic;color:#aaa}
#continueIndicator{position:absolute;bottom:10px;right:20px;font-size:24px;animation:bounce .5s infinite alternate;display:none}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(5px)}}
#interactionHUD{position:absolute;top:20px;right:20px;font-size:20px;background:#000;border:2px solid #fff;padding:10px;display:none;z-index:15}
#musicHint{position:absolute;top:20px;left:20px;font-size:16px;color:#aaa;z-index:15}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
#fadeToBlack{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40;transition:opacity 2s ease}
#loadingNextPhase{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;color:#d4a574;text-align:center;display:none;z-index:50}
</style>
</head>

 for(const e of E){if(e.bark&&e.barkL>0&&!e.fallen&&!riot){ctx.font='18px VT323, monospace';const w=ctx.measureText(e.bark).width+12,bx=e.x+24-w/2,by=e.y+48-(e.o.scale||1)*(e.o.hat==='cook'?84:68);
  ctx.fillStyle='rgba(243,234,211,.95)';ctx.fillRect(bx,by-18,w,20);ctx.strokeStyle='#2a1c12';ctx.lineWidth=1.5;ctx.strokeRect(bx,by-18,w,20);ctx.fillStyle='#2a1c12';ctx.fillText(e.bark,bx+6,by-3)}}
 if(near){{const ny=near.y+48-(near.o.scale||1)*(near.o.hat==='cook'?90:74)+Math.sin(time/200)*2;ctx.fillStyle='#111';ctx.fillRect(near.x+13,ny-2,22,24);ctx.fillStyle='#fff';ctx.fillRect(near.x+15,ny,18,20);ctx.fillStyle='#111';ctx.font='22px VT323, monospace';ctx.fillText('!',near.x+21,ny+16)}}
 for(const p of P){ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+(1-p.l/p.m)*p.gr),0,7);ctx.fill()}ctx.globalAlpha=1;
 for(const b of B){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy||0,b.vx||-1));ctx.fillStyle='#d62020';ctx.fillRect(-20,-3,13,1.5);ctx.fillRect(-24,0,17,1.5);ctx.fillRect(-18,3,11,1.5);ctx.fillStyle='#111';ctx.fillRect(-7,-4,13,8);ctx.fillStyle='#555';ctx.fillRect(-5,-3,6,2);ctx.restore()}
 ctx.restore();
 ctx.fillStyle='rgba(255,190,120,.07)';ctx.fillRect(0,0,VW,VH);
 requestAnimationFrame(frame)}

addEventListener('keydown',e=>{
 wake();const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;
 if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
 if(k===' '||k==='Enter'||k==='z')advance();
 if(k==='e'){if(D)advance();else if(near)talk(near)}
 if(k==='m'){audioOn=!audioOn;if(audioOn)bgMusic.play().catch(()=>{});else bgMusic.pause();$('musicHint').textContent=audioOn?'Music: ON [M to toggle]':'Music: OFF [M to toggle]'}
});
addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
initGame();requestAnimationFrame(frame);
